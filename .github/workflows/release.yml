# Publica os binarios que o Rokit consome.
#
# O Rokit detecta SO e arquitetura pelo NOME do asset, procurando palavras como
# `windows`/`linux`/`macos` e `x86_64`/`aarch64`. Os nomes abaixo seguem esse
# formato de proposito — mudar o padrao quebra a instalacao silenciosamente,
# porque o Rokit simplesmente nao acha asset compativel.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            nome: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            nome: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            nome: linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            nome: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            nome: macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # O linker cruzado so e necessario no alvo ARM do Linux; nos demais o
      # runner ja e nativo.
      - name: Linker para aarch64-linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empacotar
        shell: bash
        run: |
          nome="modux-${{ matrix.nome }}"
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/modux.exe" "dist/modux.exe"
            (cd dist && 7z a "../${nome}.zip" modux.exe)
          else
            cp "target/${{ matrix.target }}/release/modux" "dist/modux"
            chmod +x dist/modux
            (cd dist && zip "../${nome}.zip" modux)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: modux-${{ matrix.nome }}
          path: modux-${{ matrix.nome }}.zip

  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: assets/*.zip
          generate_release_notes: true
