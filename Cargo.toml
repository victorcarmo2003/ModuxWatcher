[package]
name = "modux"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Gerador de tipos do framework Modux para Roblox"
repository = "https://github.com/victorcarmo2003/modux"
license = "MIT"

[[bin]]
name = "modux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
