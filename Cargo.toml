[package]
name = "modux"
version = "0.7.1"
edition = "2021"
rust-version = "1.80"
description = "Type generator for the Modux Roblox framework"
repository = "https://github.com/victorcarmo2003/ModuxWatcher"
license = "MIT"

[[bin]]
name = "modux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
full_moon = { version = "2.2.0", features = ["luau"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
